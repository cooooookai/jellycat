<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>小卖部</title>
  <style>
    :root { --bg:#16151d; --panel:#1f1d29; --ink:#f3ead7; --dim:#8d8698; --line:#3a3647; --gold:#f2c14a; --pink:#e05a6f; --ok:#7ed491; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; user-select: none; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    h1 { margin: 0; font-size: 16px; }
    .coins { display: flex; align-items: center; gap: 6px; font: 700 15px ui-monospace, Menlo, monospace; color: var(--gold); }
    .coins i { width: 14px; height: 14px; background: var(--gold); border: 2px solid #b8862a; border-radius: 50%; }
    .hint { padding: 0 16px 8px; color: var(--dim); font-size: 11px; }
    nav { display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
    nav button { font: inherit; color: var(--dim); background: none; border: 2px solid var(--line); padding: 4px 10px; cursor: pointer; }
    nav button.on { color: var(--bg); background: var(--ink); border-color: var(--ink); font-weight: 700; }
    main { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
    .slotTitle { margin: 12px 0 6px; color: var(--dim); font-size: 11px; }
    .slotTitle:first-child { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
    .card { background: var(--panel); border: 2px solid var(--line); padding: 6px; cursor: pointer; position: relative; }
    .card:hover { border-color: #6f6a7e; }
    .card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242,193,74,.25); }
    .card canvas { display: block; width: 100%; image-rendering: pixelated; background: #0f0e14; }
    .card .name { margin-top: 5px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; font-size: 11px; color: var(--dim); }
    .price { color: var(--gold); font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
    .tag { font-size: 10px; padding: 0 4px; border: 1px solid currentColor; }
    .tag.own { color: var(--dim); }
    .tag.use { color: var(--ok); }
    footer { border-top: 2px solid var(--line); padding: 10px 16px 14px; background: var(--panel); min-height: 74px; }
    footer .what { font-size: 12px; color: var(--dim); }
    footer .what b { color: var(--ink); }
    footer .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    footer button { font: inherit; font-weight: 700; color: var(--bg); background: var(--ink); border: 0; padding: 6px 14px; box-shadow: 3px 3px 0 #000; cursor: pointer; }
    footer button.buy { background: var(--gold); }
    footer button.ghost { background: none; color: var(--dim); box-shadow: none; border: 2px solid var(--line); padding: 4px 12px; }
    footer button:disabled { background: var(--line); color: var(--dim); box-shadow: none; cursor: default; }
    footer button:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
    .msg { font-size: 12px; color: var(--pink); margin-left: 4px; }
    .msg.ok { color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <h1>🐈‍⬛🪼 小卖部</h1>
    <div class="coins"><i></i><span id="coins">0</span></div>
  </header>
  <div class="hint">金币是两个人一起的。点一件东西，小房间里会先预览，喜欢再买。</div>
  <nav id="tabs"></nav>
  <main id="list"></main>
  <footer>
    <div class="what" id="what">选一件东西看看</div>
    <div class="row">
      <button id="act" hidden></button>
      <button id="unequip" class="ghost" hidden>收起来</button>
      <button id="cancel" class="ghost" hidden>取消预览</button>
      <span class="msg" id="msg"></span>
    </div>
  </footer>
  <script type="module" src="shop.js"></script>
</body>
</html>
