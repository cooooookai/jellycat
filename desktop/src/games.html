<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>游戏厅</title>
  <style>
    :root { --bg:#16151d; --panel:#1f1d29; --panel2:#272434; --ink:#f3ead7; --dim:#8d8698; --line:#3a3647; --gold:#f2c14a; --pink:#e05a6f; --ok:#7ed491; --blue:#6aa8f0; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; user-select: none; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 10px; border-bottom: 2px solid var(--line); }
    h1 { margin: 0; font-size: 16px; }
    .who { font-size: 12px; color: var(--dim); display: flex; gap: 10px; align-items: center; }
    .dot { display: inline-block; width: 8px; height: 8px; background: var(--dim); margin-right: 4px; }
    .dot.on { background: var(--ok); }
    main { flex: 1; overflow-y: auto; padding: 14px 16px 16px; position: relative; }
    button { font: inherit; font-weight: 700; color: var(--bg); background: var(--ink); border: 0; padding: 6px 14px; box-shadow: 3px 3px 0 #000; cursor: pointer; }
    button.gold { background: var(--gold); }
    button.pink { background: var(--pink); color: #fff; }
    button.ghost { background: none; color: var(--dim); box-shadow: none; border: 2px solid var(--line); padding: 4px 12px; }
    button:disabled { background: var(--line); color: var(--dim); box-shadow: none; cursor: default; }
    button:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
    input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); padding: 5px 8px; outline: none; user-select: text; }
    input[type=text]:focus { border-color: var(--dim); }
    .hint { color: var(--dim); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card { background: var(--panel); border: 2px solid var(--line); padding: 12px; }

    /* 大厅 */
    .machines { display: grid; gap: 12px; }
    .machine { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 2px solid var(--line); padding: 14px; cursor: pointer; }
    .machine:hover { border-color: #6f6a7e; }
    .machine .icon { font-size: 34px; width: 54px; height: 54px; display: grid; place-items: center; background: var(--panel2); border: 2px solid var(--line); flex: none; }
    .machine b { font-size: 15px; }
    .machine p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
    .banner { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 12px; margin-bottom: 12px; background: #2b2333; border: 2px solid var(--gold); }
    .banner b { color: var(--gold); }
    .waiting { text-align: center; padding: 40px 0; }
    .waiting .big { font-size: 40px; animation: bob 1s steps(2) infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    /* 游戏里通用 */
    .gamebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .gamebar .title { font-weight: 700; font-size: 14px; }
    .center { text-align: center; }
    .result { text-align: center; padding: 24px 0 8px; }
    .result .big { font-size: 46px; }
    .result h2 { margin: 6px 0; font-size: 18px; }
    .toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: var(--panel2); border: 2px solid var(--ink); padding: 6px 12px; box-shadow: 3px 3px 0 #000; z-index: 9; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>🕹️ 游戏厅</h1>
    <div class="who"><span id="meTag"></span><span><span class="dot" id="pDot"></span><span id="pTag"></span></span></div>
  </header>
  <main id="main"></main>
  <script type="module" src="games.js"></script>
</body>
</html>
