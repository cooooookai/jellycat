<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>小水母和小黑猫</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
    body { width: 100vw; height: 100vh; position: relative; font: 12px/1.35 -apple-system, "PingFang SC", "Microsoft YaHei UI", "Hiragino Sans", sans-serif; }
    #room { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
    .bubble {
      position: absolute; transform: translate(-50%, -100%);
      max-width: 150px; padding: 4px 7px; color: #2a2030; background: #fffaf0;
      border: 2px solid #2a2030; box-shadow: 2px 2px 0 rgba(0,0,0,.35);
      word-break: break-word; white-space: pre-wrap; pointer-events: auto;
      animation: pop .18s steps(3) both; transition: opacity .3s;
    }
    .bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -6px; width: 6px; height: 6px; margin-left: -3px;
      background: #fffaf0; border-right: 2px solid #2a2030; border-bottom: 2px solid #2a2030; transform: rotate(45deg) scale(.8);
    }
    .bubble.link { cursor: pointer; background: #fff1c9; }
    .bubble.link::after { background: #fff1c9; }
    .bubble.fade { opacity: 0; }
    @keyframes pop { from { transform: translate(-50%, -80%) scale(.6); } to { transform: translate(-50%, -100%) scale(1); } }
    #input {
      position: absolute; display: none; transform: translate(-50%, -100%);
      width: 160px; padding: 5px 7px; font: inherit; color: #2a2030; background: #fffaf0;
      border: 2px solid #2a2030; box-shadow: 2px 2px 0 rgba(0,0,0,.35); outline: none;
    }
    #coins {
      position: absolute; display: none; transform: translate(-50%, -100%); align-items: center; gap: 4px; pointer-events: none; white-space: nowrap;
      padding: 2px 7px 2px 4px; font: 700 11px/1.2 ui-monospace, Menlo, monospace; color: #5a3d1a;
      background: rgba(255, 246, 220, .82); border: 2px solid #5a3d1a; cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,.25);
    }
    #coins i { width: 10px; height: 10px; background: #f2c14a; border: 2px solid #b8862a; border-radius: 50%; box-sizing: border-box; }
    #coins.bump { animation: bump .4s steps(3); }
    @keyframes bump { 50% { transform: scale(1.25); } }
    .earn {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none;
      font: 700 11px/1 ui-monospace, Menlo, monospace; color: #f2c14a; text-shadow: 1px 1px 0 #5a3d1a, -1px -1px 0 #5a3d1a, 1px -1px 0 #5a3d1a, -1px 1px 0 #5a3d1a;
      animation: rise 1.6s ease-out forwards;
    }
    @keyframes rise { to { transform: translate(-50%, -260%); opacity: 0; } }
    #previewTag {
      position: absolute; right: 8px; top: 6px; display: none; padding: 2px 6px;
      font: 700 10px/1.3 -apple-system, "PingFang SC", sans-serif; color: #fff; background: #e05a6f; pointer-events: none;
    }
    #badge {
      position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
      padding: 1px 6px; font-size: 10px; color: #f3ead7; background: rgba(22,21,29,.8); display: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="room"></canvas>
  <input id="input" maxlength="200" spellcheck="false">
  <div id="badge"></div>
  <div id="coins"><i></i><b>0</b></div>
  <div id="previewTag">预览中</div>
  <script type="module" src="app.js"></script>
</body>
</html>
