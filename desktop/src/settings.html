<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>设置</title>
  <style>
    :root { --bg:#16151d; --panel:#1f1d29; --ink:#f3ead7; --dim:#8d8698; --line:#3a3647; --ok:#7ed491; --bad:#e2706b; --accent:#f2a65a; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 18px; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .status { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-bottom: 14px; }
    .dot { width: 8px; height: 8px; background: var(--bad); flex: none; }
    .status.ok .dot { background: var(--ok); }
    section { background: var(--panel); border: 2px solid var(--line); padding: 12px; margin-bottom: 10px; }
    h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 0 0 8px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row label { cursor: pointer; }
    input[type=text], input[type=password], textarea {
      display: block; width: 100%; margin-top: 4px; padding: 6px 8px; font: inherit; color: var(--ink);
      background: var(--bg); border: 2px solid var(--line); outline: none; resize: none;
    }
    textarea { height: 54px; font: 11px/1.3 ui-monospace, Menlo, monospace; word-break: break-all; }
    .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
    .err { color: var(--bad); font-size: 12px; margin-top: 6px; min-height: 0; }
    .okmsg { color: var(--ok); font-size: 12px; margin-top: 6px; }
    button {
      margin-top: 8px; font: inherit; font-weight: 700; color: var(--bg); background: var(--ink);
      border: 0; padding: 6px 14px; box-shadow: 3px 3px 0 #000; cursor: pointer;
    }
    button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
    .or { text-align: center; color: var(--dim); font-size: 11px; margin: -2px 0 8px; }
    details { color: var(--dim); }
    summary { cursor: pointer; font-size: 12px; padding: 2px 0 6px; }
    details label { display: block; margin: 8px 0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>小水母和小黑猫</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>

  <section>
    <h2>① 我是</h2>
    <div class="row">
      <label><input type="radio" name="who" value="cat"> 🐈‍⬛ 小黑猫</label>
      <label><input type="radio" name="who" value="jelly"> 🪼 小水母</label>
    </div>
  </section>

  <section>
    <h2>② 配对：一个人生成配对码发给另一个人</h2>
    <label class="row"><span><input type="checkbox" id="hostServer"> 这台电脑当服务器</span></label>
    <div class="hint" id="hostHint">两台电脑在同一个 Wi-Fi 下时用。不在一起的话，取消勾选，填你们租的服务器地址。</div>
    <div id="serverBox" hidden>
      <input type="text" id="server" placeholder="wss://你们的服务器">
    </div>
    <button id="btnMake">生成配对码</button>
    <textarea id="code" readonly hidden></textarea>
    <div class="okmsg" id="madeMsg" hidden>已复制，用微信发给 TA 就好。</div>
    <div class="err" id="makeErr"></div>
  </section>
  <div class="or">— 或者 —</div>
  <section>
    <h2>收到了 TA 的配对码</h2>
    <textarea id="paste" placeholder="粘贴 JC- 开头的配对码"></textarea>
    <button id="btnApply">配对</button>
    <div class="err" id="applyErr"></div>
    <div class="okmsg" id="applyOk" hidden></div>
  </section>

  <details>
    <summary>更多设置</summary>
    <label>大小 <span class="row" id="scales"></span></label>
    <label><input type="checkbox" id="hideInGame"> 打游戏时自动藏起来</label>
    <label>额外的游戏（进程名，用逗号隔开）<input type="text" id="games" placeholder="比如 Palworld, HoYoPlay"></label>
    <label>房间号<input type="text" id="room"></label>
    <label>密钥<input type="password" id="secret"></label>
    <button id="btnSave">保存</button>
  </details>

  <script src="settings.js"></script>
</body>
</html>
